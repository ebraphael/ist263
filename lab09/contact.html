        <div class="flexcontact2">
            <div class="flexsection2"> <!-- form -->
                <h2>Request to Meet with Eliza</h2>

                <form action="https://formspree.io/f/xaenylbw" method="POST">

                    <label for="fullname">Your Full Name: </label>
                    <input type="text" id="fullname" name="fullname" class="formfield-margin">
                    <br>

                    <!-- email of requester -->
                    <label for="email">Your Email: </label>
                    <input type="text" id="email" name="email">
                    <br>

                    <h3>Areas of Interest / Meeting Topic</h3>
                    <input type="checkbox" id="reason1" name="mentorship" value="Mentorship">
                    <label for="reason1">Mentorship</label>
                    <br>
                    <input type="checkbox" id="reason2" name="employment" value="Employment">
                    <label for="reason2">Employment</label>
                    <br>
                    <input type="checkbox" id="reason3" name="academics" value="Academics">
                    <label for="reason3">Academics</label>
                    <br>
                    <input type="checkbox" id="reason4" name="other" value="Other" class="formfield-margin">
                    <label for="reason4">Other</label>
                    <br>

                    <!-- text area -->
                    <label for="otherexp">If Other, please specify: </label>
                    <br>
                    <textarea id="otherexp" name="special" class="formfield-margin"></textarea>
                    <br>

                    <!-- text area 2 -->
                    <label for="meettimes">Times you are generally available: </label>
                    <br>
                    <textarea id="meettimes" name="meetingtimes" class="formfield-margin"></textarea>
                    <br>

                    <!-- submit button -->
                    <input type="submit" value="Submit Request">

                </form>
                <br>
            </div>
