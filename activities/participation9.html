<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participation 9</title>

    <style>
        body {
            color: cornflowerblue;
            font-weight: bold;
        }

        @media only screen and (max-width: 800px) {
            .large-text {display: none;} /* inside media query takes display of element away */
        }

        @media only screen and (min-width: 800px) {
            .small-text {display: none;} /* inside media query takes display of element away */
        }
    </style>

</head>
<body>
    <p class="large-text">I'm large.</p>

    <p class="small-text">I'm small.</p>
</body>
</html>
