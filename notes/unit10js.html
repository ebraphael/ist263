<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        h2 {
            border: 1px solid navy;
        }
    </style>

    <script>
        function FirstFunction () {
           alert('Hello World!'); 
        }
        function clicky () {
            alert('Thanks for clicking!');
        }
        function hovery () {
            alert('Thanks for rolling over me!');
        }
    </script>
</head>
<body onload="FirstFunction()">
    <h1>JavaScript Basics</h1>
    <p onclick="clicky()">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Et, sed est nemo, sint reprehenderit ea laborum maxime tenetur ab impedit eos id. In obcaecati magni atque delectus tempora fugiat iusto.
    </p>
    <h2 onmouseover="hovery()">Hover Text</h2>
</body>
</html>
