<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- caption tag required -->
    <caption>World Population</caption>

    <table>
        <!-- row 1 / headers -->
        <tr>
            <th>Country</th>
            <th>Population</th>
            <th>% of the World</th>
            <th>Date</th>
        </tr>

        <!-- row 2 / content -->
        <tr>
            <td>India</td>
            <td>1,425,775,850</td>
            <td>17.2%</td>
            <td>12 Apr 2023</td>
        </tr>

        <!-- row 3 / content -->
        <tr>
            <td>China</td>
            <td>1,409,670,000</td>
            <td>17.0%</td>
            <td>17 Jan 2024</td>     
        </tr>

        <!-- row 4 / content -->
        <tr>
            <td>United States</td>
            <td>339,777,727</td>
            <td>4.11%</td>
            <td>12 Sep 2026</td>     
        </tr>

    </table>

</body>
</html>
